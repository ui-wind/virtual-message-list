  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^26.6.6
  vitest: ^5.1.0
  '@vitejs/plugin-react': ^6.3.0
  vite-plugin-dts: ^5.1.2
  playwright: ^1.65.0
  '@vitest/browser': ^5.1.0
  '@vitest/browser-playwright': ^5.1.0
  oxlint: ^1.93.0
  oxfmt: ^0.78.0
  oxlint-tsgolint: ^7.0.2007
  tiny-invariant: ^1.3.3
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@microsoft/api-extractor': ^7.60.1
  jsdom: ^31.0.0
