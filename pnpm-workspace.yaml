packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples'

strictPeerDependencies: false

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - '@oxlint/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'

catalog:
  typescript: ^7.0.2

  vite: ^7.3.1
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^22.19.1
  vitest: ^5.0.3
  '@vitejs/plugin-react': ^6.1.2
  vite-plugin-dts: ^5.1.2
  playwright: ^1.60.0
  '@vitest/browser': ^5.0.3
  '@vitest/browser-playwright': ^5.0.3
  oxlint: ^1.87.0
  oxfmt: ^0.72.0
  oxlint-tsgolint: ^7.0.2004
  tiny-invariant: ^1.3.3
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@microsoft/api-extractor': ^7.59.4
  jsdom: ^30.1.2
  knip: ^5.86.0
  '@ladle/react': ^5.1.1
