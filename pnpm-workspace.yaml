packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples'

strictPeerDependencies: false

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - '@oxlint/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'

catalog:
  typescript: ^7.0.2

  vite: ^8.3.4
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^26.6.5
  vitest: ^5.0.5
  '@vitejs/plugin-react': ^6.1.2
  vite-plugin-dts: ^5.1.2
  playwright: ^1.64.1
  '@vitest/browser': ^5.0.5
  '@vitest/browser-playwright': ^5.0.5
  oxlint: ^1.89.0
  oxfmt: ^0.74.0
  oxlint-tsgolint: ^7.0.2005
  tiny-invariant: ^1.3.3
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@microsoft/api-extractor': ^7.59.4
  jsdom: ^30.1.3
  knip: ^6.42.1
  '@ladle/react': ^5.1.1
